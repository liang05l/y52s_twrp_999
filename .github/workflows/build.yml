name: Build TWRP for vivo Y52s (PD2057)

on:
  workflow_dispatch:
    inputs:
      apply_999:
        description: "移植用户 999 解密组件 (prebuilt-999 → ramdisk)"
        required: false
        default: "true"
      jobs:
        description: "编译并发数"
        required: false
        default: "4"
  # 只在手动触发时构建：单次要跑 1~3 小时，避免每次 push 都占满 Actions 额度

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - name: Checkout device tree overlay
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          # 只装真正缺的包（runner 自带 gcc/g++/make/git/curl/zip/python3）
          # 注意：不要装 imagemagick / g++-multilib / lib32*，会拉 i386 依赖，慢且没必要
          echo "#!/bin/sh" | sudo tee /usr/sbin/needrestart >/dev/null 2>&1 || true
          echo "exit 0" | sudo tee -a /usr/sbin/needrestart >/dev/null 2>&1 || true
          # runner 开机时 unattended-upgrades 常持有 dpkg 锁，apt 会一直等锁
          sudo systemctl stop unattended-upgrades  >/dev/null 2>&1 || true
          sudo systemctl disable unattended-upgrades >/dev/null 2>&1 || true
          sudo pkill -f unattended-upgrade >/dev/null 2>&1 || true
          for i in $(seq 1 30); do
            sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || break
            echo "等待 dpkg 锁释放... ($i)"; sleep 2
          done
          need=""
          for b in bc bison flex gperf lz4 rsync schedtool; do
            command -v "$b" >/dev/null 2>&1 || need="$need $b"
          done
          [ -e /usr/include/openssl/ssl.h ]  || need="$need libssl-dev"
          [ -e /usr/include/zlib.h ]         || need="$need zlib1g-dev"
          [ -e /usr/include/libxml2 ]        || need="$need libxml2-dev"
          [ -e /usr/bin/xsltproc ]           || need="$need xsltproc"
          [ -e /usr/bin/pngcrush ]           || need="$need pngcrush"
          [ -e /usr/lib/x86_64-linux-gnu/libncurses.so.5 ] || need="$need libncurses5"
          echo "需要安装:${need:- (无)}"
          if [ -n "$need" ]; then
            timeout 180 sudo -E apt-get -y -o DPkg::Lock::Timeout=30 --no-install-recommends update || echo "::warning::apt update 超时/失败，继续"
            timeout 300 sudo -E apt-get -y --no-install-recommends \
              -o DPkg::Lock::Timeout=30 -o Dpkg::Options::=--force-confnew -o Acquire::Retries=2 install $need
          fi
          echo "--- 自检 ---"
          for b in bc bison flex gperf lz4 rsync schedtool make gcc g++ python3 zip unzip; do
            printf "%-10s " "$b"; command -v "$b" || echo "(缺失)"
          done

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Init and sync TWRP 12.1
        env:
          TWRP_DIR: ${{ runner.workspace }}/twrp
        run: |
          set -e
          git config --global user.name  "ci"
          git config --global user.email "ci@localhost"
          git config --global url.https://github.com/.insteadOf ssh://git@github.com/
          mkdir -p "$TWRP_DIR"
          cd "$TWRP_DIR"
          echo "TWRP_DIR=$TWRP_DIR"; df -h "$TWRP_DIR"
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
                    -b twrp-12.1 --depth=1
          time repo sync -c -j"$(nproc --all)" --force-sync --no-clone-bundle --no-tags --optimized-fetch
          df -h "$TWRP_DIR"

      - name: Fetch upstream device tree (for large prebuilts)
        env:
          TWRP_DIR: ${{ runner.workspace }}/twrp
        run: |
          set -e
          cd "$TWRP_DIR"
          git clone --depth 1 -b twrp-12.1 \
            https://github.com/liang05l/android_device_vivo_pd2031.git \
            device/vivo/k6853v1_64_6360

      - name: Overlay Y52s (PD2057) device tree
        env:
          TWRP_DIR: ${{ runner.workspace }}/twrp
        run: |
          set -e
          cd "$TWRP_DIR"
          rsync -a --exclude='.git' --exclude='.github' \
            "$GITHUB_WORKSPACE/device/vivo/k6853v1_64_6360/" \
            device/vivo/k6853v1_64_6360/
          # 999 组件是否注入，由 prebuilt-999 目录的 rename 决定
          if [ "${{ github.event.inputs.apply_999 || 'true' }}" != "true" ]; then
            mv "$GITHUB_WORKSPACE/prebuilt-999" "$GITHUB_WORKSPACE/prebuilt-999.disabled"
            echo "999 graft disabled"
          fi
          echo "--- 关键配置自检 ---"
          grep -n "PD2057" device/vivo/k6853v1_64_6360/BoardConfig.mk
          grep -n "PRODUCT_MODEL\|FOX_DEVICE_MODEL\|BUILD_FINGERPRINT" device/vivo/k6853v1_64_6360/omni_k6853v1_64_6360.mk
          ls -l device/vivo/k6853v1_64_6360/prebuilt/
          ls device/vivo/k6853v1_64_6360/patches/system_vold/

      - name: Apply patches (vold + bootable/recovery)
        env:
          TWRP_DIR: ${{ runner.workspace }}/twrp
        run: |
          set -e
          cd "$TWRP_DIR"
          python3 device/vivo/k6853v1_64_6360/patches/apply-patches.sh 2>&1 | tee /tmp/patches.log
          echo "--- 冲突检查 ---"
          if grep -q "✗" /tmp/patches.log; then
            echo "::error::有补丁应用失败，见 /tmp/patches.log"
            exit 1
          fi

      - name: Build recoveryimage
        env:
          TWRP_DIR: ${{ runner.workspace }}/twrp
        run: |
          set -e
          cd "$TWRP_DIR"
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          source build/envsetup.sh
          lunch omni_k6853v1_64_6360-eng
          time mka recoveryimage -j"$(nproc --all)"
          ls -lh out/target/product/k6853v1_64_6360/recovery.img

      - name: Graft user-999 decryption components
        if: ${{ github.event.inputs.apply_999 != 'false' }}
        env:
          TWRP_DIR: ${{ runner.workspace }}/twrp
        run: |
          set -e
          cd "$TWRP_DIR"
          IMG="$PWD/out/target/product/k6853v1_64_6360/recovery.img"
          cp "$IMG" "${IMG}.source-only"
          echo "--- 源码构建原版另存为 recovery.img.source-only ---"
          python3 "$GITHUB_WORKSPACE/tools/graft_999_precise.py" \
            --base "$IMG" \
            --donor-dir "$GITHUB_WORKSPACE/prebuilt-999" \
            --out "$IMG" 2>&1 | tee /tmp/graft.log
          if ! grep -q "全部自检通过" /tmp/graft.log; then
            echo "::warning::999 注入自检未通过，本次保留源码构建版本（不影响出镜像）"
            cp "${IMG}.source-only" "$IMG"
          fi

      - name: Make hybrid image with vivo AVB footer
        env:
          TWRP_DIR: ${{ runner.workspace }}/twrp
        run: |
          set -e
          cd "$TWRP_DIR"
          python3 device/vivo/k6853v1_64_6360/make_hybrid.py \
            out/target/product/k6853v1_64_6360/recovery.img
          python3 - <<'PY'
          import struct,hashlib,os
          p=os.path.join(os.environ['TWRP_DIR'],'out/target/product/k6853v1_64_6360/recovery.img')
          d=open(p,'rb').read()
          print('size', len(d))
          print('sha256', hashlib.sha256(d).hexdigest())
          f=d[-64:]
          print('footer magic', f[:4], 'vbmeta_off', struct.unpack('>Q',f[20:28])[0],
                'vbmeta_size', struct.unpack('>Q',f[28:36])[0])
          open(os.path.join(os.environ['TWRP_DIR'],'SHA256SUMS'),'w').write(hashlib.sha256(d).hexdigest()+'  recovery.img\n')
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: twrp-y52s-pd2057
          path: |
            ${{ runner.workspace }}/twrp/out/target/product/k6853v1_64_6360/recovery.img
            ${{ runner.workspace }}/twrp/out/target/product/k6853v1_64_6360/recovery.img.source-only
            ${{ runner.workspace }}/twrp/SHA256SUMS
          if-no-files-found: warn
          retention-days: 14
