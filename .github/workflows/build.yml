name: Build TWRP for vivo Y52s (PD2057)

on:
  workflow_dispatch:
    inputs:
      apply_999:
        description: "移植用户 999 解密组件 (prebuilt-999 → ramdisk)"
        required: false
        default: "true"
      jobs:
        description: "编译并发数"
        required: false
        default: "4"
  # 只在手动触发时构建：单次要跑 1~3 小时，避免每次 push 都占满 Actions 额度

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - name: Checkout device tree overlay
        uses: actions/checkout@v4

      - name: Preflight checks
        run: |
          python3 - <<'PY'
          import struct, glob, sys, hashlib, os
          base = 'device/vivo/k6853v1_64_6360'
          # 1) dtb 表必须自洽（上一版这里被写成 dtbo 的 199573，越界导致内核挂死）
          dtb = open(os.path.join(base, 'prebuilt/dtb.img'), 'rb').read()
          magic, total, hs, es, cnt = struct.unpack_from('>IIIII', dtb, 0)
          assert magic == 0xD7B7AB1E, 'dtb 魔数不对'
          assert total == len(dtb), 'dtb 表 total=%d 与文件长度 %d 不符' % (total, len(dtb))
          off, sz = struct.unpack_from('>II', dtb, hs)
          assert off + sz <= len(dtb), 'dtb 表项越界 (off=%d size=%d len=%d)' % (off, sz, len(dtb))
          # 2) 引导段存在
          for f in ('prebuilt/kernel', 'prebuilt/dtbo.img'):
              n = os.path.getsize(os.path.join(base, f))
              assert n > 0, f + ' 为空'
          # 3) 触控：必须是 y52s 版二进制 + 7 个 PD2057 固件
          v = open(os.path.join(base, 'recovery/root/system/bin/vts_app_recovery'), 'rb').read()
          assert len(v) == 108800, 'vts_app_recovery 大小 %d，不是 y52s 版(108800)' % len(v)
          fw = sorted(glob.glob(os.path.join(base, 'recovery/root/vendor/firmware/TP*PD2057*.bin')))
          assert len(fw) == 7, 'PD2057 触控固件数量 %d，应为 7' % len(fw)
          # 4) 触控 sysfs 权限块（源码树 rc 里没有，必须由我们注入）
          frag = open(os.path.join(base, 'touch/touch_perms.fragment'), encoding='utf-8').read()
          assert frag.count('vivo_ts') >= 80, 'touch_perms.fragment 内容不完整'
          assert 'on boot' in frag, 'touch_perms.fragment 缺少 on boot 段'
          # 5) FBE 解密：root-of-trust 模板 + 对齐脚本必须齐备且为原厂 RSA2048 模板
          tpl = open('prebuilt/boot_ref.bin', 'rb').read()
          assert len(tpl) == 3776, 'boot_ref.bin 长度 %d != 3776' % len(tpl)
          assert tpl[:8] == b'ANDROID!', '模板 boot header 不是 ANDROID!'
          assert tpl[2048:2052] == b'AVB0', '模板 vbmeta 不是 AVB0'
          alg, = struct.unpack_from('>I', tpl, 2048 + 0x1C)
          auth, = struct.unpack_from('>Q', tpl, 2048 + 0x0C)
          assert alg == 1 and auth == 320, \
              '模板不是原厂 RSA2048 vbmeta (algorithm=%d auth=%d)' % (alg, auth)
          assert struct.unpack_from('<Q', tpl, 0x674)[0] == 0x4BC80000, '模板 dtb_addr 不对'
          assert os.path.getsize('tools/align_avb.py') > 0, 'align_avb.py 缺失'

          print('PREFLIGHT OK  dtb: total=%d entries=%d  vts_app_recovery=%d  fw=%d  dtbo=%d  avb_tpl=%d' %
                (total, cnt, len(v), len(fw),
                 os.path.getsize(os.path.join(base, 'prebuilt/dtbo.img')), len(tpl)))
          PY

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          # 只装真正缺的包（runner 自带 gcc/g++/make/git/curl/zip/python3）
          # 注意：不要装 imagemagick / g++-multilib / lib32*，会拉 i386 依赖，慢且没必要
          echo "#!/bin/sh" | sudo tee /usr/sbin/needrestart >/dev/null 2>&1 || true
          echo "exit 0" | sudo tee -a /usr/sbin/needrestart >/dev/null 2>&1 || true
          # runner 开机时 unattended-upgrades 常持有 dpkg 锁，apt 会一直等锁
          sudo systemctl stop unattended-upgrades  >/dev/null 2>&1 || true
          sudo systemctl disable unattended-upgrades >/dev/null 2>&1 || true
          sudo pkill -f unattended-upgrade >/dev/null 2>&1 || true
          for i in $(seq 1 30); do
            sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || break
            echo "等待 dpkg 锁释放... ($i)"; sleep 2
          done
          need=""
          for b in bc bison flex gperf lz4 rsync schedtool ccache; do
            command -v "$b" >/dev/null 2>&1 || need="$need $b"
          done
          [ -e /usr/include/openssl/ssl.h ]  || need="$need libssl-dev"
          [ -e /usr/include/zlib.h ]         || need="$need zlib1g-dev"
          [ -e /usr/include/libxml2 ]        || need="$need libxml2-dev"
          [ -e /usr/bin/xsltproc ]           || need="$need xsltproc"
          [ -e /usr/bin/pngcrush ]           || need="$need pngcrush"
          [ -e /usr/lib/x86_64-linux-gnu/libncurses.so.5 ] || need="$need libncurses5"
          echo "需要安装:${need:- (无)}"
          if [ -n "$need" ]; then
            timeout 180 sudo -E apt-get -y -o DPkg::Lock::Timeout=30 --no-install-recommends update || echo "::warning::apt update 超时/失败，继续"
            timeout 300 sudo -E apt-get -y --no-install-recommends \
              -o DPkg::Lock::Timeout=30 -o Dpkg::Options::=--force-confnew -o Acquire::Retries=2 install $need
          fi
          echo "--- 自检 ---"
          for b in bc bison flex gperf lz4 rsync schedtool make gcc g++ python3 zip unzip; do
            printf "%-10s " "$b"; command -v "$b" || echo "(缺失)"
          done

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Mount ccache on tmpfs
        run: |
          # soong sandbox 不允许 ccache 与源码同分区（否则 Read-only file system）
          # 官方解法：把 ccache 放到独立挂载点。这里用 tmpfs，再配合 actions/cache 持久化。
          sudo mkdir -p /mnt/ccache
          sudo mount -t tmpfs -o size=6G,mode=0777 tmpfs /mnt/ccache
          sudo chmod 0777 /mnt/ccache
          df -h /mnt/ccache
          touch /mnt/ccache/.wtest && rm -f /mnt/ccache/.wtest && echo "tmpfs 可写 OK"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: /mnt/ccache
          key: ccache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Setup ccache
        run: |
          CCBIN="$(command -v ccache || echo /usr/bin/ccache)"
          if [ ! -x "$CCBIN" ]; then echo "::warning::ccache 缺失，本次不启用"; exit 0; fi
          echo "CCACHE_DIR=/mnt/ccache"  >> $GITHUB_ENV
          echo "USE_CCACHE=1"            >> $GITHUB_ENV
          echo "CCACHE_EXEC=$CCBIN"      >> $GITHUB_ENV
          echo "CCACHE_COMPRESS=1"       >> $GITHUB_ENV
          "$CCBIN" -M 5G -F 0 || true
          "$CCBIN" -z || true
          "$CCBIN" -s | head -n 10 || true

      - name: Init and sync TWRP 12.1
        env:
          TWRP_DIR: ${{ runner.workspace }}/twrp
        run: |
          set -e
          git config --global user.name  "ci"
          git config --global user.email "ci@localhost"
          git config --global url.https://github.com/.insteadOf ssh://git@github.com/
          mkdir -p "$TWRP_DIR"
          cd "$TWRP_DIR"
          echo "TWRP_DIR=$TWRP_DIR"; df -h "$TWRP_DIR"
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
                    -b twrp-12.1 --depth=1
          time repo sync -c -j"$(nproc --all)" --force-sync --no-clone-bundle --no-tags --optimized-fetch
          df -h "$TWRP_DIR"

      - name: Fetch upstream device tree (for large prebuilts)
        env:
          TWRP_DIR: ${{ runner.workspace }}/twrp
        run: |
          set -e
          cd "$TWRP_DIR"
          git clone --depth 1 -b twrp-12.1 \
            https://github.com/liang05l/android_device_vivo_pd2031.git \
            device/vivo/k6853v1_64_6360

      - name: Overlay Y52s (PD2057) device tree
        env:
          TWRP_DIR: ${{ runner.workspace }}/twrp
        run: |
          set -e
          cd "$TWRP_DIR"
          rsync -a --exclude='.git' --exclude='.github' \
            "$GITHUB_WORKSPACE/device/vivo/k6853v1_64_6360/" \
            device/vivo/k6853v1_64_6360/
          # 999 组件是否注入，由 prebuilt-999 目录的 rename 决定
          if [ "${{ github.event.inputs.apply_999 || 'true' }}" != "true" ]; then
            mv "$GITHUB_WORKSPACE/prebuilt-999" "$GITHUB_WORKSPACE/prebuilt-999.disabled"
            echo "999 graft disabled"
          fi
          echo "--- 关键配置自检 ---"
          grep -n "PD2057" device/vivo/k6853v1_64_6360/BoardConfig.mk
          grep -n "PRODUCT_MODEL\|FOX_DEVICE_MODEL\|BUILD_FINGERPRINT" device/vivo/k6853v1_64_6360/omni_k6853v1_64_6360.mk
          ls -l device/vivo/k6853v1_64_6360/prebuilt/
          ls device/vivo/k6853v1_64_6360/patches/system_vold/

      - name: Fix product model in init rc (y73s PD2031 -> y52s PD2057)
        env:
          TWRP_DIR: ${{ runner.workspace }}/twrp
        run: |
          set -e
          cd "$TWRP_DIR"
          python3 - <<'PY'
          import glob, sys, os
          # 上游设备树是 y73s(PD2031) 的，init rc 里写死了
          #   setprop ro.vivo.product.model PD2031 / ro.product.model PD2031
          # vivo 的 vts_app_recovery 会按这个属性去找触控固件，
          # 找不到 PD2031 的固件就崩溃 -> 固件写不进触控 IC -> 触摸完全失效。
          # 必须改成 PD2057，否则 recovery 里没有触摸。
          n = 0
          for p in glob.glob('device/vivo/*/recovery/root/init.recovery.*.rc'):
              s = open(p, encoding='utf-8').read()
              if 'PD2031' not in s:
                  continue
              new = s.replace('PD2031', 'PD2057')
              open(p, 'w', encoding='utf-8', newline='\n').write(new)
              print('patched %s: PD2031 x%d -> PD2057' % (p, s.count('PD2031')))
              n += 1
          if n == 0:
              print('::warning::rc 里没有 PD2031（可能上游已修），继续')
          # 就地验证：改完必须一处 PD2031 都不剩
          left = []
          for q in glob.glob('device/vivo/*/recovery/root/init.recovery.*.rc'):
              if 'PD2031' in open(q, encoding='utf-8', errors='replace').read():
                  left.append(q)
          if left:
              sys.exit('ERROR: 仍有 rc 残留 PD2031: %s（触控会失效）' % left)
          print('product model 校验通过：rc 中无 PD2031')
          PY

      - name: Apply patches (vold + bootable/recovery)
        env:
          TWRP_DIR: ${{ runner.workspace }}/twrp
        run: |
          set -e
          cd "$TWRP_DIR"
          python3 device/vivo/k6853v1_64_6360/patches/apply-patches.sh 2>&1 | tee /tmp/patches.log
          echo "--- 冲突检查 ---"
          if grep -q "✗" /tmp/patches.log; then
            echo "::error::有补丁应用失败，见 /tmp/patches.log"
            exit 1
          fi

      - name: Inject touch sysfs permissions into init rc
        env:
          TWRP_DIR: ${{ runner.workspace }}/twrp
        run: |
          set -e
          cd "$TWRP_DIR"
          python3 - <<'PY'
          import sys
          dev = 'device/vivo/k6853v1_64_6360'
          rcp = dev + '/recovery/root/init.recovery.mt6853.rc'
          frag = open(dev + '/touch/touch_perms.fragment', encoding='utf-8').read().rstrip('\n')
          s = open(rcp, encoding='utf-8').read()
          if 'touch sysfs perms' in s:
              print('already injected'); sys.exit(0)
          lines = s.split('\n')
          i_exec = next((k for k, x in enumerate(lines) if 'vts_app_recovery --update' in x), None)
          if i_exec is None:
              sys.exit('ERROR: rc 中没有 vts_app_recovery --update')
          i_sec = next((k for k in range(i_exec, -1, -1) if lines[k].startswith('on boot')), None)
          if i_sec is None:
              sys.exit('ERROR: 没找到 on boot 段')
          lines[i_sec:i_sec] = frag.split('\n')
          open(rcp, 'w', encoding='utf-8', newline='\n').write('\n'.join(lines))
          print('touch perms 注入完成，插入于第 %d 行' % i_sec)
          PY
          echo "rc 中 vivo_ts 行数: $(grep -c vivo_ts device/vivo/k6853v1_64_6360/recovery/root/init.recovery.mt6853.rc)"

      - name: Suppress dynamic-partition mount errors (002 等效补丁)
        env:
          TWRP_DIR: ${{ runner.workspace }}/twrp
        run: |
          set -e
          cd "$TWRP_DIR"
          python3 - <<'PY'
          import re, sys, os
          p = 'bootable/recovery/partition.cpp'
          if not os.path.exists(p):
              print('::warning::partition.cpp 不存在，跳过 fail_mount 抑制')
              sys.exit(0)
          s = open(p, encoding='utf-8').read()
          if 'Mount_Point != "/vendor"' in s:
              print('already patched'); sys.exit(0)
          lines = s.split('\n'); hit = 0
          for i, l in enumerate(lines):
              if 'gui_msg' in l and 'fail_mount=' in l:
                  for j in range(i - 1, max(-1, i - 4), -1):
                      if 'Display_Error' in lines[j] and 'Removable' in lines[j]:
                          ind = re.match(r'\s*', lines[j]).group(0)
                          cond = lines[j].rstrip()
                          if not cond.endswith(')'):
                              break
                          lines[j] = (cond[:-1] + ' &&\n' + ind +
                                      '\tMount_Point != "/vendor" && Mount_Point != "/system_root" && Mount_Point != "/persist")')
                          hit += 1
                          break
          if hit == 0:
              print('::warning::没找到 fail_mount 的 if 条件，跳过（仅影响日志里那几条提示，不影响功能）')
              sys.exit(0)
          open(p, 'w', encoding='utf-8').write('\n'.join(lines))
          print('patched fail_mount 条件处数 =', hit)
          PY

      - name: Build recoveryimage
        env:
          TWRP_DIR: ${{ runner.workspace }}/twrp
        run: |
          set -e
          cd "$TWRP_DIR"
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          source build/envsetup.sh
          lunch omni_k6853v1_64_6360-eng
          time mka recoveryimage -j"$(nproc --all)"
          echo "---- ccache 统计 ----"; ccache -s | head -n 12 || true
          ls -lh out/target/product/k6853v1_64_6360/recovery.img

      - name: Graft user-999 decryption components
        if: ${{ github.event.inputs.apply_999 != 'false' }}
        env:
          TWRP_DIR: ${{ runner.workspace }}/twrp
        run: |
          set -e
          cd "$TWRP_DIR"
          IMG="$PWD/out/target/product/k6853v1_64_6360/recovery.img"
          cp "$IMG" "${IMG}.source-only"
          echo "--- 源码构建原版另存为 recovery.img.source-only ---"
          python3 "$GITHUB_WORKSPACE/tools/graft_999_precise.py" \
            --base "$IMG" \
            --donor-dir "$GITHUB_WORKSPACE/prebuilt-999" \
            --out "$IMG" 2>&1 | tee /tmp/graft.log
          if ! grep -q "全部自检通过" /tmp/graft.log; then
            echo "::warning::999 注入自检未通过，本次保留源码构建版本（不影响出镜像）"
            cp "${IMG}.source-only" "$IMG"
          fi

      - name: Make hybrid image with vivo AVB footer
        env:
          TWRP_DIR: ${{ runner.workspace }}/twrp
        run: |
          set -e
          cd "$TWRP_DIR"
          python3 device/vivo/k6853v1_64_6360/make_hybrid.py \
            out/target/product/k6853v1_64_6360/recovery.img
          python3 - <<'PY'
          import struct,hashlib,os
          p=os.path.join(os.environ['TWRP_DIR'],'out/target/product/k6853v1_64_6360/recovery.img')
          d=open(p,'rb').read()
          print('size', len(d))
          print('sha256', hashlib.sha256(d).hexdigest())
          f=d[-64:]
          print('footer magic', f[:4], 'vbmeta_off', struct.unpack('>Q',f[20:28])[0],
                'vbmeta_size', struct.unpack('>Q',f[28:36])[0])
          open(os.path.join(os.environ['TWRP_DIR'],'SHA256SUMS'),'w').write(hashlib.sha256(d).hexdigest()+'  recovery.img\n')
          PY

      - name: Align boot root-of-trust with stock vbmeta (FBE decryption)
        env:
          TWRP_DIR: ${{ runner.workspace }}/twrp
        run: |
          set -e
          cd "$TWRP_DIR"
          IMG="$PWD/out/target/product/k6853v1_64_6360/recovery.img"
          python3 "$GITHUB_WORKSPACE/tools/align_avb.py" \
            --img "$IMG" \
            --template "$GITHUB_WORKSPACE/prebuilt/boot_ref.bin" \
            --out "$IMG.rot-aligned"
          mv "$IMG.rot-aligned" "$IMG"
          python3 - <<'PY'
          import os, struct, hashlib
          p = os.path.join(os.environ['TWRP_DIR'],
                           'out/target/product/k6853v1_64_6360/recovery.img')
          d = open(p, 'rb').read()
          f = d[-64:]
          sect = struct.unpack_from('>Q', f, 0x0C)[0]
          vo   = struct.unpack_from('>Q', f, 0x14)[0]
          vs   = struct.unpack_from('>Q', f, 0x1C)[0]
          vb   = d[vo:vo+vs]
          assert vb[:4] == b'AVB0', 'vbmeta 缺失'
          alg  = struct.unpack_from('>I', vb, 0x1C)[0]
          ab   = struct.unpack_from('>Q', vb, 0x0C)[0]
          aux  = struct.unpack_from('>Q', vb, 0x14)[0]
          assert alg == 1 and ab == 320 and vs == 1728, \
              'vbmeta 不是原厂模板 alg=%d auth=%d size=%d' % (alg, ab, vs)
          qd = 256 + ab + 16
          pn, sl, rl, _ = struct.unpack_from('>IIII', vb, qd + 40)
          off = qd + 116
          salt = vb[off+pn:off+pn+sl]
          digest = vb[off+pn+sl:off+pn+sl+rl]
          assert hashlib.sha256(salt + d[:sect]).digest() == digest, 'AVB root digest 不自洽'
          assert hashlib.sha256(vb[:256] + vb[256+ab:256+ab+aux]).digest() == vb[256:288], \
              'vbmeta hash 不自洽'
          assert struct.unpack_from('<Q', d, 0x674)[0] == 0x4BC80000, 'dtb_addr 未对齐原厂'
          print('ROT ALIGN OK  algorithm=1 auth=320 aux=%d vbmeta=%d dtb_addr=0x4BC80000' %
                (aux, vs))
          PY

      - name: Verify built image
        env:
          TWRP_DIR: ${{ runner.workspace }}/twrp
        run: |
          cd "$TWRP_DIR"
          python3 - <<'PY'
          import os, sys, gzip, struct, hashlib
          sys.path.insert(0, os.path.join(os.environ['GITHUB_WORKSPACE'], 'tools'))
          from bootimg import parse_header, layout
          from cpio import read_cpio
          img = 'out/target/product/k6853v1_64_6360/recovery.img'
          d = open(img, 'rb').read()
          assert len(d) == 100663296, '镜像大小 %d != 96MiB' % len(d)
          assert d[-64:-60] == b'AVBf', 'AVB footer 缺失'
          h = parse_header(d); l = layout(h, len(d))
          assert h['dtb_addr'] == 0x4BC80000, 'dtb_addr 未对齐原厂'
          assert h['cmdline'].count('buildvariant=eng') == 1, 'cmdline 有重复 buildvariant'
          f = d[-64:]
          vo = struct.unpack_from('>Q', f, 0x14)[0]
          vs = struct.unpack_from('>Q', f, 0x1C)[0]
          vb = d[vo:vo+vs]
          assert struct.unpack_from('>I', vb, 0x1C)[0] == 1, 'vbmeta 算法不是原厂 RSA2048'
          assert vs == 1728, 'vbmeta 大小 %d 不是原厂模板' % vs
          dtb = d[l['dtb'][0]:l['dtb'][1]]
          ref = open('device/vivo/k6853v1_64_6360/prebuilt/dtb.img', 'rb').read()
          assert dtb == ref, 'dtb 段与原厂不一致'
          E = {e['name']: e['blob'] for e in read_cpio(gzip.decompress(d[l['ramdisk'][0]:l['ramdisk'][1]]))}
          rc = E['init.recovery.mt6853.rc'].decode('utf-8', 'replace')
          assert rc.count('vivo_ts') >= 80, 'rc 缺少触控权限块 (%d)' % rc.count('vivo_ts')
          assert len(E['system/bin/vts_app_recovery']) == 108800, 'vts_app_recovery 不是 y52s 版'
          fw = [n for n in E if n.startswith('vendor/firmware/') and 'PD2057' in n]
          assert len(fw) == 7, 'PD2057 固件 %d 个' % len(fw)
          grafted = 'system/kslib' in E
          print('VERIFY OK  dtb=一致  rc vti_ts=%d  vts=%d  fw=%d  999注入=%s  size=%d' %
                (rc.count('vivo_ts'), len(E['system/bin/vts_app_recovery']), len(fw), grafted, len(d)))
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: twrp-y52s-pd2057
          path: |
            ${{ runner.workspace }}/twrp/out/target/product/k6853v1_64_6360/recovery.img
            ${{ runner.workspace }}/twrp/out/target/product/k6853v1_64_6360/recovery.img.source-only
            ${{ runner.workspace }}/twrp/SHA256SUMS
          if-no-files-found: warn
          retention-days: 14
